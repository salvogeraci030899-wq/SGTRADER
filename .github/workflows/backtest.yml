name: Esegui Backtest Kronos

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Asset'
        required: true
        default: 'BTCUSDT'
        type: choice
        options:
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT
      timeframe:
        description: 'Timeframe'
        required: true
        default: '4h'
        type: choice
        options:
          - 1d
          - 4h
          - 1h
      n_samples:
        description: 'Campioni Monte Carlo per candela (il bot live ne usa 50)'
        required: true
        default: '20'
      max_steps:
        description: 'Candele da analizzare, le più recenti (0 = tutte)'
        required: true
        default: '300'

# Un solo backtest alla volta per asset/timeframe
concurrency:
  group: backtest-${{ github.event.inputs.symbol }}-${{ github.event.inputs.timeframe }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout codice
        uses: actions/checkout@v5
      - name: Dati cifrati
        uses: ./.github/actions/data-key
        with:
          key: ${{ secrets.DATA_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache modelli Hugging Face
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-v1

      # Stesse dipendenze del bot live: il modello arriva dal pacchetto kronos-model-arch
      - name: Installa dipendenze
        # torch solo CPU: i server di GitHub non hanno GPU; evita di scaricare le librerie CUDA (vari GB)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt

      # Gli input passano da variabili d'ambiente, mai incollati direttamente nel comando.
      # --max-minutes ferma il backtest e salva il CSV prima del timeout del job.
      - name: Esegui Backtest
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
          N_SAMPLES: ${{ github.event.inputs.n_samples }}
          MAX_STEPS: ${{ github.event.inputs.max_steps }}
        run: |
          python backtest.py --symbol "$SYMBOL" --tf "$TIMEFRAME" \
            --n-samples "$N_SAMPLES" --max-steps "$MAX_STEPS" --max-minutes 300

      - name: Salva i risultati
        if: always()
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: |
          FILE="trades_${SYMBOL}_${TIMEFRAME}.csv"
          if [ ! -f "$FILE" ]; then
            echo "Nessun CSV prodotto, niente da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Risultati Backtest ${SYMBOL} ${TIMEFRAME}" || { echo "Nessuna modifica da salvare"; exit 0; }
          # Nel frattempo il bot può aver fatto push: riallineo e riprovo
          # riallineamento sicuro se un altro workflow ha salvato nel frattempo (conflitti risolti, JSON controllati)
          bash tools/push_state.sh
