name: Test

# Test automatici della logica del bot (track record, validazione). Leggeri: non installano il modello Kronos.
on:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'api/**', 'worker/**', 'src/**', 'index.html', 'style.css', '.gitattributes', '.github/actions/**', 'ruff.toml', 'eslint.config.js', 'package.json', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'tests/**', 'api/**', 'worker/**', 'src/**', 'index.html', 'style.css', '.gitattributes', '.github/actions/**', 'ruff.toml', 'eslint.config.js', 'package.json', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests cryptography ruff
      - name: Controllo statico (Python e JavaScript)
        run: |
          ruff check .
          npx --yes eslint@10.14.0 .
      - name: Esegui i test
        # tutti i file tests/test_*.py: uno nuovo entra da solo; si ferma al primo che fallisce
        run: |
          set -e
          for t in tests/test_*.py; do echo "== $t"; python "$t"; done
          node tests/test_core.mjs
          node tests/test_rules.mjs
          node tests/test_lab_engine.mjs
      # Chiamate vere a Bitget futures: fallisce se mancano prezzo mark, funding o open interest
      - name: Dati futures veri
        run: python futures_data.py --check

  # Interfaccia in un browser vero: ogni pagina su iPhone 15 e 17 Pro, Simulato e Reale,
  # senza errori JavaScript e senza scroll verticale (tests/ui_smoke.mjs)
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Prova dell'interfaccia
        run: node tests/ui_smoke.mjs
