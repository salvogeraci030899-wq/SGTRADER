name: Test

# Test automatici della logica del bot (track record, validazione). Leggeri: non installano il modello Kronos.
on:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'api/**', 'worker/**', 'src/**', 'index.html', 'style.css', '.gitattributes', '.github/actions/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'tests/**', 'api/**', 'worker/**', 'src/**', 'index.html', 'style.css', '.gitattributes', '.github/actions/**', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests cryptography
      - name: Esegui i test
        run: |
          python tests/test_datacrypt.py
          python tests/test_track_record.py
          python tests/test_validation.py
          python tests/test_futures_data.py
          python tests/test_strategies_validation.py
          python tests/test_strategy_lab.py
          python tests/test_run_bot.py
          python tests/test_paper.py
          python tests/test_automation.py
          python tests/test_executor.py
          python tests/test_daily_report.py
          python tests/test_price_alerts.py
          python tests/test_quick.py
          python tests/test_agent.py
          python tests/test_events.py
          python tests/test_futures_archive.py
          python tests/test_watchdog.py
          python tests/test_position.py
          node tests/test_core.mjs
          node tests/test_rules.mjs
          node tests/test_lab_engine.mjs
      # Chiamate vere a Bitget futures: fallisce se mancano prezzo mark, funding o open interest
      - name: Dati futures veri
        run: python futures_data.py --check

  # Interfaccia in un browser vero: ogni pagina su iPhone 15 e 17 Pro, Simulato e Reale,
  # senza errori JavaScript e senza scroll verticale (tests/ui_smoke.mjs)
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Prova dell'interfaccia
        run: node tests/ui_smoke.mjs
