name: Posizione Bitget

# Comandi sulle posizioni REALI, avviati dall'assistente dell'app (chat o voce) dopo la conferma:
# chiusura a mercato, take profit, stop loss, rimozione di TP/SL. Le regole sono in position_cmd.py.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'close, tp, sl, clear, untp/unsl (toglie solo TP o SL) o refresh (solo rilettura del conto)'
        required: true
        type: choice
        options: [open, close, tp, sl, clear, untp, unsl, refresh]
      symbol:
        required: true
        type: choice
        options: [BTCUSDT, ETHUSDT, SOLUSDT]
      side:
        required: true
        type: choice
        options: [long, short]
      price:
        description: 'livello per tp/sl; per open: lo stop loss (vuoto per close/clear)'
        required: false
        default: ''
      size:
        description: 'open: quantità in coin'
        required: false
        default: ''
      leverage:
        description: 'open: leva'
        required: false
        default: ''
      tp:
        description: 'open: take profit (facoltativo)'
        required: false
        default: ''
      market:
        description: 'futures (predefinito) o spot'
        required: false
        default: 'futures'
      req:
        description: "codice della richiesta dell'app (per mostrarne l'esito)"
        required: false
        default: ''

# Le riletture: una alla volta. I comandi: in parallelo (chiudere più posizioni insieme manda un comando per
# posizione; in un gruppo di concorrenza GitHub terrebbe in coda solo l'ultimo e annullerebbe gli altri).
concurrency:
  group: position-${{ inputs.action == 'refresh' && 'refresh' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

# Registro degli eventi (events.py): i giri scrivono in events/AAAA-MM.jsonl
env:
  PT_EVENTS_DIR: events

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      BITGET_DEMO: ${{ vars.BITGET_DEMO || '1' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Dati cifrati
        uses: ./.github/actions/data-key
        with:
          key: ${{ secrets.DATA_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # pacchetti già scaricati: la rilettura del conto (chiesta dall'app) parte qualche secondo prima
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      - name: Esegui il comando su Bitget
        env:
          # tutti gli input passano da variabili d'ambiente, mai dentro il comando (niente iniezioni)
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          SIDE: ${{ inputs.side }}
          PRICE: ${{ inputs.price }}
          SIZE: ${{ inputs.size }}
          LEVERAGE: ${{ inputs.leverage }}
          TP: ${{ inputs.tp }}
          MARKET: ${{ inputs.market }}
          POSITION_RESULT: ${{ runner.temp }}/position_result.json
        run: |
          set -o pipefail
          python position_cmd.py "$ACTION" "$SYMBOL" "$SIDE" "$PRICE" "$SIZE" "$LEVERAGE" "$TP" "$MARKET" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salva lo stato
        # anche se il comando è fallito: l'app legge l'esito (e il motivo) da live_trades.json
        if: always()
        env:
          REQ: ${{ inputs.req }}
          MARKET: ${{ inputs.market }}
          POSITION_RESULT: ${{ runner.temp }}/position_result.json
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          SIDE: ${{ inputs.side }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # l'ordine è già partito: qui si salva solo lo stato, riapplicato sulla versione più recente
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python position_cmd.py sync "$ACTION" "$SYMBOL" "$SIDE"
            git add live_trades.json
            # uno alla volta: se uno dei due non esiste ancora, l'altro va salvato lo stesso
            for f in equity_history.json events; do if [ -e "$f" ]; then git add "$f"; fi; done
            git commit -q -m "Posizione: $ACTION $SYMBOL $SIDE" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Salvataggio rifiutato (tentativo $i), riprovo..."; sleep $((i * 5))
          done
          exit 1
