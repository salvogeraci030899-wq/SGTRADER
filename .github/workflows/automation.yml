name: Automazione

# Comandi della dashboard sulle strategie: accendere/spegnere (su carta o reale) ed emergenza.
# Lo avvia il server comandi (api/_core.js) quando premi un tasto nell'app; si può avviare anche a mano.
# Il controllo vero è in automation.py: il reale solo per strategie confermate, niente durante l'emergenza.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'set = cambia lo stato di una strategia, emergency = spegni tutto, resume = sblocca'
        required: true
        type: choice
        options: [set, emergency, resume, risk, trading, alert]
      key:
        description: 'Strategia (set, es. big_candle_trail:1d) oppure limite di rischio (risk)'
        required: false
        default: ''
      mode:
        description: 'off/paper/live (set), valore (risk), on/off (trading), add/del/clear (alert)'
        required: false
        default: ''

# Un comando alla volta, nell'ordine in cui arrivano: due comandi insieme non devono sovrascriversi
concurrency:
  group: automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      # Gli input passano da variabili d'ambiente, mai incollati direttamente nel comando
      - name: Applica il comando
        env:
          ACTION: ${{ github.event.inputs.action }}
          KEY: ${{ github.event.inputs.key }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -o pipefail
          if [ "$ACTION" = "set" ] || [ "$ACTION" = "risk" ]; then
            python automation.py "$ACTION" "$KEY" "$MODE" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$ACTION" = "alert" ]; then
            python automation.py alert "$MODE" "$KEY" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$ACTION" = "trading" ]; then
            python automation.py trading "$MODE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python automation.py "$ACTION" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Salva
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation.json
          git add live_trades.json 2>/dev/null || true
          git commit -m "Automazione: $ACTION $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica"; exit 0; }
          bash tools/push_state.sh
