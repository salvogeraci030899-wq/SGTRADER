name: Agente

# Agente gestore (agent.py). Ogni giorno alle 18:41 UTC decide; la domenica (e quando lo avvii dall'app)
# prima rilancia il laboratorio sui dati nuovi, con la prova finale per le strategie pronte (agent.py
# --unseal-plan: buone su carta, mai provate sui mesi tenuti da parte; una volta sola ciascuna).
# Regole, autonomia, profilo e stile: vedi agent.py. Il reale dell'agente richiede autonomia "live"
# E l'interruttore degli ordini veri acceso, entrambi dall'app.
on:
  schedule:
    - cron: '41 18 * * 1-6'     # lunedì-sabato: solo le scelte
    - cron: '41 18 * * 0'       # domenica: laboratorio, prova finale, scelte e rapporto completo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    name: Laboratorio aggiornato
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 18 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lab-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      - name: Calcola (con la prova finale per le strategie pronte)
        run: |
          UNSEAL="$(python agent.py --unseal-plan)"
          echo "Prova finale: ${UNSEAL:-nessuna}" | tee -a "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          python strategy_lab.py --unseal $UNSEAL > /dev/null
      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lab_summary.json lab_registry.json validation/LABORATORIO.md
          git commit -m "Agente: laboratorio aggiornato $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica"; exit 0; }
          bash tools/push_state.sh

  agent:
    name: Scelte e rapporto
    needs: lab
    # gira anche quando il laboratorio è saltato (giorni feriali), non se è fallito
    if: ${{ !cancelled() && (needs.lab.result == 'success' || needs.lab.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # stesso gruppo dei comandi dell'app: automation.json cambia un comando alla volta
    concurrency:
      group: automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      - name: Agente
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '41 18 * * 0' }}
        run: |
          if [ "$FULL" = "true" ]; then python agent.py --full-report; else python agent.py; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation.json agent_state.json
          git commit -m "Agente: scelte $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica"; exit 0; }
          bash tools/push_state.sh
