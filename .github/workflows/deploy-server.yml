name: Pubblica server comandi

# Pubblica il server comandi (worker/index.js + api/_core.js) su Cloudflare Workers, gratis.
# Il worker fa anche da orologio: avvia il bot ogni 15 minuti in modo puntuale.
# Parte da solo quando cambiano quei file su main, oppure a mano.
#
# Da fare una volta sola (Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   token Cloudflare con permesso "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account Cloudflare
#   SERVER_GH_TOKEN        token GitHub (fine-grained) solo su questo repository, permesso "Actions: Read and write"
#   APP_SECRET             facoltativo: solo se vuoi mandare i comandi dell'app dal server invece che dal token sul telefono
#   GROQ_API_KEY           facoltativo, per l'analisi AI
# Senza questi segreti il workflow si ferma subito e spiega cosa manca, senza errori rossi.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'api/_core.js', 'src/core/commands.js', 'src/core/rules.js', 'src/core/telegram.js', 'src/core/config.js', 'src/core/datacrypt.js', 'tools/telegram_webhook.py', '.github/workflows/deploy-server.yml']

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controlla i segreti
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_TOKEN_S: ${{ secrets.SERVER_GH_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GH_TOKEN_S" ] || missing="$missing SERVER_GH_TOKEN"
          if [ -n "$missing" ]; then
            echo "Segreti mancanti:$missing. Server non pubblicato." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Pubblica su Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_TOKEN_S: ${{ secrets.SERVER_GH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          # repository e indirizzo dei dati letti dal repository stesso: dopo un cambio di nome basta ripubblicare
          REPO="${{ github.repository }}"; PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          npx --yes wrangler@3.114.0 deploy --var "GH_REPO:$REPO" --var "DATA_BASE:$PAGES" 2>&1 | tee deploy.log
          if [ -n "$APP_SECRET" ]; then printf '%s' "$APP_SECRET" | npx --yes wrangler@3.114.0 secret put APP_SECRET; fi
          printf '%s' "$GH_TOKEN_S" | npx --yes wrangler@3.114.0 secret put GH_TOKEN
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | npx --yes wrangler@3.114.0 secret put GROQ_API_KEY; fi
          # chiave dei dati cifrati (tools/datacrypt.py): il bot Telegram li legge; l'IA risponde solo a chi ha la chiave
          if [ -n "$DATA_KEY" ]; then printf '%s' "$DATA_KEY" | npx --yes wrangler@3.114.0 secret put DATA_KEY; fi
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -n 1)
          echo "Server pubblicato: ${url:-vedi il log}. Da ora il bot parte ogni 15 minuti da Cloudflare." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_SECRET" ]; then echo "Comandi dal server attivi: indirizzo da inserire in Impostazioni -> Comandi." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy
      # Bot Telegram in sola lettura (/stato, /posizioni, /agente, /carta, /avvisi). Il server risponde solo alla
      # tua chat e solo ai messaggi con il segreto del webhook, generato qui a ogni pubblicazione. Il token passa
      # solo da variabili d'ambiente (wrangler lo legge dallo standard input, lo script Python dall'ambiente).
      - name: Bot Telegram
        if: steps.check.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ steps.deploy.outputs.url }}/api/telegram
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Segreti Telegram assenti: bot non attivato."; exit 0; fi
          WEBHOOK_SECRET="$(openssl rand -hex 24)"
          export WEBHOOK_SECRET
          printf '%s' "$TELEGRAM_TOKEN" | npx --yes wrangler@3.114.0 secret put TELEGRAM_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@3.114.0 secret put TELEGRAM_CHAT_ID
          printf '%s' "$WEBHOOK_SECRET" | npx --yes wrangler@3.114.0 secret put TELEGRAM_WEBHOOK_SECRET
          pip install -q requests
          python ../tools/telegram_webhook.py | tee -a "$GITHUB_STEP_SUMMARY"
