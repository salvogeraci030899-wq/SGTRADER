name: Kronos Bot

on:
  # L'orologio vero è Cloudflare (worker/wrangler.toml, ogni 15 minuti). Questo schedule di GitHub
  # resta solo di riserva, una volta l'ora: è "best effort" e può ritardare o saltare.
  schedule:
    - cron: '39 * * * *'

  # RIMOSSO IL TRIGGER PUSH: il bot non partirà più a ogni salvataggio
  # Esecuzione manuale con scelta dei parametri
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Scegli Asset (ALL = Tutti)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT
      timeframe:
        description: 'Scegli Timeframe (ALL = Tutti)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - 1d
          - 4h
          - 1h
      force:
        description: 'Ricalcola anche senza nuove candele (gli avvii programmati da Cloudflare usano false)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Evita che due esecuzioni si accavallino
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # Evita di riscaricare i pesi di Kronos da Hugging Face a ogni run
      - name: Cache modelli Hugging Face
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-v1

      - name: Install dependencies
        # torch solo CPU: i server di GitHub non hanno GPU; evita di scaricare le librerie CUDA (vari GB)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt

      - name: Run Bot
        env:
          SYMBOL: ${{ github.event.inputs.symbol || 'ALL' }}
          TIMEFRAME: ${{ github.event.inputs.timeframe || 'ALL' }}
          # Le esecuzioni manuali ricalcolano sempre; lo schedule solo se c'è una nuova candela chiusa
          FORCE: ${{ (github.event_name == 'schedule' || github.event.inputs.force == 'false') && '0' || '1' }}
          N_SAMPLES: ${{ vars.N_SAMPLES || '50' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ordini veri solo con queste chiavi E l'interruttore generale acceso nell'app E una strategia confermata
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          BITGET_DEMO: ${{ vars.BITGET_DEMO || '1' }}
        run: python run_bot.py

      - name: Commit and Sync updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.json alerts_state.json
          git add track_record.jsonl track_record_summary.json 2>/dev/null || true
          git add futures_data.json futures_history.jsonl 2>/dev/null || true
          git add paper_trades.json 2>/dev/null || true
          git add live_trades.json 2>/dev/null || true
          git commit -m "chore: auto-update $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica da salvare"; exit 0; }
          # Lo stato deve arrivare sul repo anche se un altro workflow ha salvato nel frattempo:
          # riallineamento sicuro (conflitti risolti, JSON controllati) in tools/push_state.sh
          bash tools/push_state.sh
